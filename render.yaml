services:
  - type: web
    name: smcf-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: LIPIA_API_KEY
        sync: false
      - key: LIPIA_APP_ID
        sync: false
      - key: LIPIA_APP_NAME
        value: smcf
      - key: LIPIA_APP_TYPE
        value: TILL
      - key: LIPIA_API_URL
        value: https://lipia-api.kreativelabske.com/api/v2
      - key: SACCO_API_KEY
        sync: false
      - key: SACCO_CLIENT_URL
        value: https://smcf.app

  - type: web
    name: smcf-sacco-backend
    env: node
    region: oregon
    plan: free
    rootDir: smcf-sacco-backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        value: https://smcf.app
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
