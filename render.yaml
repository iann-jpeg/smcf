services:
  - type: web
    name: smcf-sacco-backend
    env: node
    region: oregon
    plan: free
    rootDir: smcf-sacco-backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
